	adafruit/Adafruit INA219@^1.2.3
	labfruits/Mcp320x@^1.4.2

build_src_filter = +<LaunchController3.0/LaunchController3.0.cpp>
build_flags = 
    ; (MsgPacketizerの設定)
    -D PACKETIZER_MAX_CALLBACK_QUEUE_SIZE=12 ; 無線パケット追加に伴いキューサイズを12に拡張
    -D MSGPACK_MAX_ARRAY_SIZE=12

